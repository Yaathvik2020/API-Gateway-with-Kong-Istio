# ISTIO 1/3 — ENCRYPTION (mTLS)
#
# STRICT = every connection between pods in "boutique" must be mutual-TLS:
#   - encrypted (nobody on the network can read it)
#   - both sides prove who they are with certificates Istio issues automatically
# Your apps still talk plain http://product-service:3003 — the sidecars do the TLS.
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: boutique
spec:
  mtls:
    mode: STRICT
---
# Exceptions ONLY for Prometheus scraping /metrics.
# Prometheus has no sidecar, so it can't do mTLS. These allow plain HTTP on each
# service's own port; 2-authorization.yml then limits plain callers to GET /metrics.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: auth-metrics, namespace: boutique }
spec:
  selector: { matchLabels: { app: auth } }
  mtls: { mode: STRICT }
  portLevelMtls: { "3002": { mode: PERMISSIVE } }
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: product-service-metrics, namespace: boutique }
spec:
  selector: { matchLabels: { app: product-service } }
  mtls: { mode: STRICT }
  portLevelMtls: { "3003": { mode: PERMISSIVE } }
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: order-service-metrics, namespace: boutique }
spec:
  selector: { matchLabels: { app: order-service } }
  mtls: { mode: STRICT }
  portLevelMtls: { "3004": { mode: PERMISSIVE } }
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: orders-metrics, namespace: boutique }
spec:
  selector: { matchLabels: { app: orders } }
  mtls: { mode: STRICT }
  portLevelMtls: { "3005": { mode: PERMISSIVE } }
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: user-service-metrics, namespace: boutique }
spec:
  selector: { matchLabels: { app: user-service } }
  mtls: { mode: STRICT }
  portLevelMtls: { "3006": { mode: PERMISSIVE } }
