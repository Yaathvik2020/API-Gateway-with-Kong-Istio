# product-service — product catalogue.  Public path: /api/products/*  (via Kong)
# Called by: Kong, orders, order-service (to look up product prices).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service
  namespace: boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service, version: v1 }
    spec:
      serviceAccountName: product-service
      containers:
        - name: product-service
          image: 214920156606.dkr.ecr.us-east-1.amazonaws.com/product-service:7f2f5c8bd35502c3aa992acb978510fc88467775
          ports:
            - containerPort: 3003
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: PRODUCTS_DB_URL }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: boutique
  labels: { app: product-service }
  annotations:
    ingress.kubernetes.io/service-upstream: "true"
spec:
  type: ClusterIP
  selector: { app: product-service }
  ports:
    - name: http
      port: 3003
      targetPort: 3003
