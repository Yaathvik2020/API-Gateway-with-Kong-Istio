# auth — login / register.  Public path: /api/auth/*  (via Kong)
# Called by: Kong only.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth                      # Istio identity: cluster.local/ns/boutique/sa/auth
  namespace: boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth, version: v1 }
    spec:
      serviceAccountName: auth
      containers:
        - name: auth
          image: 214920156606.dkr.ecr.us-east-1.amazonaws.com/auth:b93f05cadbad40122f8c5b2a743ba5cab8f4338d
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: AUTH_DB_URL }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: boutique
  labels: { app: auth }           # ServiceMonitor finds it by this label
  annotations:
    # Kong sends to the Service IP (not pod IPs), so the Istio sidecar handles it (mTLS)
    ingress.kubernetes.io/service-upstream: "true"
spec:
  type: ClusterIP                 # private; only Kong is public
  selector: { app: auth }
  ports:
    - name: http                  # tells Istio this is HTTP
      port: 3002
      targetPort: 3002
