# user-service — profile, addresses.  Public path: /api/users/*  (via Kong)
# Called by: Kong only.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service, version: v1 }
    spec:
      serviceAccountName: user-service
      containers:
        - name: user-service
          image: 214920156606.dkr.ecr.us-east-1.amazonaws.com/user-service:7f2f5c8bd35502c3aa992acb978510fc88467775
          ports:
            - containerPort: 3006
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3006"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: USERS_DB_URL }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: JWT_SECRET }
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: JWT_REFRESH_SECRET }
          readinessProbe:
            httpGet: { path: /health, port: 3006 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3006 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: boutique
  labels: { app: user-service }
  annotations:
    ingress.kubernetes.io/service-upstream: "true"
spec:
  type: ClusterIP
  selector: { app: user-service }
  ports:
    - name: http
      port: 3006
      targetPort: 3006
