# orders — place orders, "my orders".  Public path: /api/orders/*  (via Kong)
# Called by: Kong.  Calls: product-service.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  namespace: boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders, version: v1 }
    spec:
      serviceAccountName: orders
      containers:
        - name: orders
          image: 214920156606.dkr.ecr.us-east-1.amazonaws.com/orders:5bbefcf5a8d484c155c029589833f70520b3e611
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: ORDERS_DB_URL }
            - name: PRODUCTS_SERVICE_URL       # plain http: the sidecars encrypt it (mTLS)
              value: http://product-service:3003
          readinessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: boutique
  labels: { app: orders }
  annotations:
    ingress.kubernetes.io/service-upstream: "true"
spec:
  type: ClusterIP
  selector: { app: orders }
  ports:
    - name: http
      port: 3005
      targetPort: 3005
