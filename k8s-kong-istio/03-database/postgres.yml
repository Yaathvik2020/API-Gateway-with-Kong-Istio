# PostgreSQL — one server holding 4 databases: auth_db, products_db, orders_db, users_db.
# It runs inside the mesh too: Istio encrypts DB traffic (mTLS) and the
# AuthorizationPolicy only lets the backend services connect.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boutique-postgres
  namespace: boutique
---
apiVersion: v1
kind: Service
metadata:
  name: boutique-postgres
  namespace: boutique
  labels:
    app: postgres
spec:
  clusterIP: None              # headless: stable DNS for the StatefulSet pod
  selector:
    app: postgres
  ports:
    - name: tcp-postgres       # "tcp-" prefix tells Istio this is plain TCP, not HTTP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: boutique-postgres
  namespace: boutique
spec:
  serviceName: boutique-postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: boutique-postgres
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2          # EKS default storage class
        resources:
          requests:
            storage: 10Gi
