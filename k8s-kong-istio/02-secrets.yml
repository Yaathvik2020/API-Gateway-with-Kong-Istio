# App secrets.
# !! EXAMPLE VALUES — change every "CHANGE_ME" before deploying.
# !! Don't commit real passwords to Git. Use Sealed Secrets, External Secrets
#    (AWS Secrets Manager) or SOPS, and keep only the encrypted form in Git.
#
# The Postgres password appears in 5 places below: keep them all the same.
apiVersion: v1
kind: Secret
metadata:
  name: boutique-secrets
  namespace: boutique
type: Opaque
