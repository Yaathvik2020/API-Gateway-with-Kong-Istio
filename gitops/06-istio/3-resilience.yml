# ISTIO 3/3 — RELIABILITY for product-service
#
# product-service is the most-called service (Kong, orders, order-service).
# If it's slow or a pod is broken, callers shouldn't hang or keep hitting a bad pod.
# No code change needed — the sidecars do this.
---
# Timeouts + retries
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: product-service
  namespace: boutique
spec:
  hosts: ["product-service"]
  http:
    - route:
        - destination:
            host: product-service
            port: { number: 3003 }
      timeout: 10s                 # give up on a call after 10s total
      retries:
        attempts: 3                # retry up to 3 times...
        perTryTimeout: 3s          # ...each try max 3s
        retryOn: connect-failure,refused-stream,unavailable,503   # only "safe" failures
---
# Circuit breaker: a pod that keeps failing is taken out of rotation for a while
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: product-service
  namespace: boutique
spec:
  host: product-service
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5      # 5 errors in a row...
      interval: 30s
      baseEjectionTime: 30s        # ...= pod ejected for 30s
      maxEjectionPercent: 50       # never eject more than half the pods
